  <style>
/* Общая база: сброс, служебная панель прототипа, фото-плейсхолдер, панель фильтров, тост.
   Внешний вид компонентов задают переменные темы (--ink, --bg, --accent, --r, --font…). */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body { margin: 0; padding-top: 40px; background: var(--bg, #fff); color: var(--ink, #111); font-family: var(--font, system-ui, sans-serif); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; text-decoration: none; }
h1, h2, h3, p, ul, ol, dl, dd, figure { margin: 0; padding: 0; }
ul, ol { list-style: none; }
img { max-width: 100%; display: block; }
:focus-visible { outline: 2px solid var(--focus, var(--accent, #000)); outline-offset: 2px; }
[hidden] { display: none !important; }

.ph { background-color: var(--ph, #ecebe7); background-size: cover; background-position: center; background-repeat: no-repeat; }

/* ---- служебная панель прототипа (не часть дизайна) ---- */
.cbar { position: fixed; inset: 0 0 auto 0; z-index: 100; height: 40px; display: flex; align-items: center; gap: 18px; padding: 0 16px; background: #0c0c0d; color: #d7d7d2; font: 500 12px/1 "JetBrains Mono", ui-monospace, monospace; letter-spacing: .02em; white-space: nowrap; overflow-x: auto; scrollbar-width: none; }
.cbar::-webkit-scrollbar { display: none; }
.cbar a, .cbar button { color: inherit; opacity: .62; transition: opacity .15s; }
.cbar a:hover, .cbar button:hover { opacity: 1; }
.cbar-home { opacity: .9 !important; }
.cbar-group { display: flex; gap: 2px; padding: 3px; border-radius: 8px; background: #1d1d1f; }
.cbar-group::before { content: "Дизайн"; align-self: center; padding: 0 8px 0 6px; opacity: .45; }
.cbar-group button { padding: 6px 10px; border-radius: 6px; }
.cbar-group button[aria-selected="true"] { background: #f4f4ef; color: #0c0c0d; opacity: 1; }
.cbar-mode { display: inline-flex; align-items: center; gap: 8px; flex-shrink: 0; }
.cbar-mode i { position: relative; width: 28px; height: 16px; border-radius: 8px; background: #3a3a3d; transition: background .2s; }
.cbar-mode i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #d7d7d2; transition: transform .2s; }
.cbar-mode[aria-pressed="true"] { opacity: 1; } .cbar-mode[aria-pressed="true"] i { background: #c8f03c; } .cbar-mode[aria-pressed="true"] i::after { transform: translateX(12px); background: #0c0c0d; }
.cbar-mode:disabled { opacity: .35; cursor: default; }
.cbar-screens { display: flex; gap: 16px; margin-left: auto; }
.cbar-screens a[aria-current] { opacity: 1; color: #fff; box-shadow: 0 1px 0 #fff; padding-bottom: 3px; }
@media (max-width: 720px) { .cbar { gap: 12px; padding: 0 10px; } .cbar-screens { gap: 12px; } }

.embed body { padding-top: 0; } .embed-static body { pointer-events: none; } .embed-live { scrollbar-width: none; } .embed-live::-webkit-scrollbar { display: none; }
.embed [class$="-head"] { top: 0 !important; }

/* ---- тост ---- */
.toast { position: fixed; left: 50%; bottom: 28px; z-index: 120; transform: translate(-50%, 16px); padding: 11px 16px; border-radius: var(--r, 10px); background: var(--ink, #111); color: var(--bg, #fff); font-size: 14px; opacity: 0; pointer-events: none; transition: .22s ease; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* ---- панель «все фильтры» ---- */
.sheet { position: fixed; inset: 0; z-index: 110; visibility: hidden; }
.sheet.open { visibility: visible; }
.sheet-scrim { position: absolute; inset: 0; width: 100%; background: rgba(10, 10, 10, .38); opacity: 0; transition: opacity .25s; }
.sheet.open .sheet-scrim { opacity: 1; }
.sheet-panel { position: absolute; inset: 0 0 0 auto; width: min(440px, 100%); display: flex; flex-direction: column; background: var(--surface, #fff); color: var(--ink, #111); transform: translateX(100%); transition: transform .28s cubic-bezier(.2, .8, .2, 1); }
.sheet.open .sheet-panel { transform: none; }
.sheet-panel > header { display: flex; justify-content: space-between; align-items: center; padding: 22px 24px 14px; font-size: 20px; font-family: var(--font-display, inherit); }
.sheet-panel > header button { width: 36px; height: 36px; border-radius: 50%; font-size: 15px; }
.sheet-panel > header button:hover { background: var(--line, #eee); }
.sheet-find { padding: 0 24px; }
.sheet-find input { width: 100%; height: 46px; padding: 0 14px; border: 1px solid var(--line, #ddd); border-radius: var(--r, 10px); background: var(--bg, #fff); outline: 0; }
.sheet-find input:focus { border-color: var(--ink, #111); }
.sheet-note { padding: 12px 24px 6px; font-size: 13px; line-height: 1.45; color: var(--muted, #777); }
.sheet-list { flex: 1; overflow: auto; padding: 0 24px; }
.sheet-row { border-bottom: 1px solid var(--line, #eee); }
.sheet-row summary { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; cursor: pointer; list-style: none; font-weight: 500; }
.sheet-row summary::-webkit-details-marker { display: none; }
.sheet-row summary i { width: 8px; height: 8px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg); opacity: .5; transition: transform .2s; }
.sheet-row[open] summary i { transform: rotate(-135deg); }
.sheet-opts { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 0 16px; }
.sheet-opts button { padding: 8px 13px; border: 1px solid var(--line, #ddd); border-radius: var(--r-pill, 99px); font-size: 14px; }
.sheet-opts button.on { background: var(--ink, #111); border-color: var(--ink, #111); color: var(--bg, #fff); }
.sheet-panel > footer { display: grid; grid-template-columns: auto 1fr; gap: 10px; padding: 16px 24px 22px; border-top: 1px solid var(--line, #eee); }
.sheet-reset { padding: 0 18px; height: 50px; border-radius: var(--r, 10px); border: 1px solid var(--line, #ddd); }
.sheet-apply { height: 50px; border-radius: var(--r, 10px); background: var(--cta, var(--ink, #111)); color: var(--cta-ink, var(--bg, #fff)); font-weight: 600; }

  </style>
  <style>
/* RUBERI — «Строка»: монохром, одна строка поиска, лаймовый акцент. */
[data-variant="a"] {
  --bg: #fbfbf9; --surface: #ffffff; --ink: #0d0d0e; --muted: #6c6c64; --line: #e5e4de; --ph: #eeede8;
  --accent: #c8f03c; --cta: #0d0d0e; --cta-ink: #fbfbf9; --focus: #0d0d0e;
  /* производные токены — их переопределяют темы (themes.css) */
  --accent-deep: #9ac400; --on-accent: #0d0d0e; --accent-block: var(--accent); --on-accent-block: #0d0d0e; --good: var(--accent); --on-good: #0d0d0e;
  --line-strong: #cfcdc4; --placeholder: #b3b2ab; --on-ink-muted: #cfcfc8; --on-ink-line: #333; --fav-bg: rgba(255, 255, 255, .92);
  --r: 10px; --r-pill: 8px; --font: "Onest", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;

  .a-head { position: sticky; top: 40px; z-index: 20; display: grid; grid-template-columns: auto minmax(0, 520px) auto; justify-content: space-between; align-items: center; gap: 24px; height: 64px; padding: 0 32px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
  .a-logo { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  .a-logo i, .a-foot i { font-style: normal; color: var(--accent-deep); }
  .a-head-search { position: relative; }
  .a-head-search input { width: 100%; height: 40px; padding: 0 40px 0 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); outline: 0; font-size: 14px; }
  .a-head-search input:focus { border-color: var(--ink); }
  .a-head-search kbd { position: absolute; right: 10px; top: 10px; width: 20px; height: 20px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 5px; font: 11px var(--mono); color: var(--muted); }
  .a-head-nav { display: flex; align-items: center; gap: 22px; font-size: 14px; }
  .a-head-nav button { color: var(--muted); }
  .a-head-nav button:hover { color: var(--ink); }
  .a-head-nav sup { margin-left: 3px; padding: 1px 5px; border-radius: 9px; background: var(--accent); color: var(--ink); font: 600 10px var(--mono); }
  .a-geo::before { content: "◎ "; }
  .a-head-nav .a-sell { height: 38px; padding: 0 16px; border-radius: var(--r); background: var(--ink); color: var(--bg); font-weight: 600; }
  .a-head-nav .a-sell:hover { color: var(--accent); }

  .a-main { max-width: 1320px; margin: 0 auto; padding: 0 32px 80px; }

  /* главная: строка */
  .a-hero { padding: 96px 0 56px; max-width: 880px; margin: 0 auto; }
  .a-hero h1 { font-size: clamp(44px, 7vw, 88px); line-height: .95; letter-spacing: -.055em; font-weight: 600; }
  .a-ask { position: relative; margin-top: 32px; }
  .a-ask input { width: 100%; height: 76px; padding: 0 84px 0 24px; border: 1.5px solid var(--ink); border-radius: 16px; background: var(--surface); outline: 0; font-size: 22px; letter-spacing: -.01em; box-shadow: 0 1px 0 var(--ink), 0 18px 40px -24px rgba(13, 13, 14, .35); }
  .a-ask input::placeholder { color: var(--placeholder); }
  .a-ask button { position: absolute; right: 10px; top: 10px; width: 56px; height: 56px; border-radius: 11px; background: var(--ink); color: var(--accent); font-size: 24px; transition: transform .15s; }
  .a-ask button:hover { transform: translateX(2px); }
  .a-ask-sm { margin-top: 0; }
  .a-ask-sm input { height: 58px; font-size: 18px; padding-left: 20px; border-radius: 13px; box-shadow: none; }
  .a-ask-sm button { width: 42px; height: 42px; top: 8px; right: 8px; font-size: 19px; border-radius: 9px; }

  .a-understood { display: flex; align-items: flex-start; gap: 14px; margin-top: 16px; min-height: 34px; opacity: 0; transform: translateY(-4px); transition: .2s; }
  .has-tokens .a-understood { opacity: 1; transform: none; }
  .a-understood > span { padding-top: 8px; font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); white-space: nowrap; }
  .a-tokens { display: flex; flex-wrap: wrap; gap: 6px; }
  .tok { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 6px 0 12px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; animation: a-tok .25s ease both; }
  .tok-what { background: var(--ink); border-color: var(--ink); color: var(--bg); font-weight: 500; }
  .tok-price { background: var(--accent); border-color: var(--accent); }
  .tok .tok-cycle { width: auto; height: auto; opacity: 1; font-size: inherit; border-bottom: 1px dashed currentColor; border-radius: 0; line-height: 1.2; }
  .tok-add { height: 32px; padding: 0 11px; border: 1px dashed var(--line-strong); border-radius: 8px; font-size: 13px; color: var(--muted); animation: a-tok .25s ease both; }
  .tok-add:hover { border-style: solid; border-color: var(--ink); color: var(--ink); background: var(--accent); }
  .tok button:not(.tok-cycle) { width: 20px; height: 20px; border-radius: 5px; opacity: .45; font-size: 15px; line-height: 1; }
  .tok button:hover { opacity: 1; }
  .a-hint { margin-top: 18px; max-width: 560px; font-size: 14px; line-height: 1.5; color: var(--muted); }

  .a-cats { display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--ink); border-left: 1px solid var(--line); }
  .a-cats a { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 16px 16px 15px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); font-size: 15px; font-weight: 500; transition: background .15s; }
  .a-cats a:hover { background: var(--accent); }
  .a-cats small, .a-subs small { font: 11px var(--mono); color: var(--muted); white-space: nowrap; }
  .a-cats a:hover small { color: var(--ink); }

  .a-block { margin-top: 64px; }
  .a-block-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 20px; }
  .a-block-head h2 { font-size: 26px; letter-spacing: -.035em; font-weight: 600; }
  .a-block-head span { font: 12px var(--mono); color: var(--muted); }

  /* карточка */
  .a-grid { display: grid; gap: 28px 16px; }
  .a-grid-5 { grid-template-columns: repeat(5, 1fr); }
  .a-grid-4 { grid-template-columns: repeat(4, 1fr); }
  .a-card { display: block; min-width: 0; }
  .a-card-img { position: relative; overflow: hidden; border-radius: var(--r); }
  .a-card-img .ph { aspect-ratio: 1; transition: transform .5s cubic-bezier(.2, .8, .2, 1); }
  .a-card:hover .ph { transform: scale(1.035); }
  .a-fav { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; border-radius: 8px; background: var(--fav-bg); font-size: 16px; line-height: 1; opacity: 0; transition: .15s; }
  .a-card:hover .a-fav, .a-fav.on, .a-gallery-main .a-fav { opacity: 1; }
  .a-fav.on { background: var(--ink); color: var(--accent); }
  .a-card-row { display: flex; align-items: center; gap: 8px; margin-top: 11px; }
  .a-card-row strong { font-size: 17px; letter-spacing: -.02em; font-weight: 600; }
  .a-tag { padding: 2px 6px; border-radius: 5px; background: var(--accent); font: normal 500 10px var(--mono); text-transform: uppercase; letter-spacing: .04em; }
  .a-card h3 { margin-top: 3px; font-size: 14px; font-weight: 400; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .a-card p { margin-top: 4px; font: 11px/1.4 var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* поиск */
  .a-query { padding: 32px 0 0; max-width: 880px; }
  .a-market { display: grid; grid-template-columns: auto auto 1fr auto; gap: 40px; align-items: end; margin: 28px 0 8px; padding: 20px 24px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
  .a-market small { display: block; font: 500 10px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .a-market strong { display: block; margin: 6px 0 2px; font-size: 26px; letter-spacing: -.035em; font-weight: 600; }
  .a-market div > span { font-size: 12px; color: var(--muted); }
  .a-hist { position: relative; display: flex; align-items: flex-end; gap: 4px; height: 64px; padding-bottom: 16px; max-width: 360px; justify-self: center; width: 100%; }
  .a-hist i { flex: 1; min-height: 3px; border-radius: 3px 3px 0 0; background: var(--line); }
  .a-hist i.in { background: var(--ink); }
  .a-hist span { position: absolute; bottom: 0; font: 10px var(--mono); color: var(--muted); }
  .a-hist span:nth-of-type(1) { left: 0; } .a-hist span:nth-of-type(2) { left: 50%; transform: translateX(-50%); } .a-hist span:nth-of-type(3) { right: 0; }

  .a-toolbar { position: sticky; top: 104px; z-index: 10; display: flex; justify-content: space-between; gap: 16px; padding: 14px 0; margin-bottom: 12px; background: var(--bg); border-bottom: 1px solid var(--line); }
  .a-pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .a-pill, .a-sort { position: relative; }
  .a-pill > button, .a-sort > button, .a-pill-more { display: flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); font-size: 14px; }
  .a-pill > button::after, .a-sort > button::after { content: ""; width: 6px; height: 6px; margin: -3px 0 0 4px; border-right: 1.5px solid; border-bottom: 1.5px solid; transform: rotate(45deg); opacity: .5; }
  .a-pill > button:hover, .a-pill.open > button, .a-pill-more:hover { border-color: var(--ink); }
  .a-pill.set > button { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .a-pill.set > button span { opacity: .6; }
  .a-pill b:empty { display: none; }
  .a-pill b, .a-sort b { font-weight: 500; }
  .a-pill-more { border-style: dashed; color: var(--muted); font-family: var(--mono); font-size: 12px; }
  .a-sort > button { border-color: transparent; background: none; color: var(--muted); }
  .a-sort b { color: var(--ink); }
  .a-pop { position: absolute; top: 44px; left: 0; z-index: 30; min-width: 190px; padding: 6px; border: 1px solid var(--ink); border-radius: 12px; background: var(--surface); box-shadow: 0 20px 40px -20px rgba(0, 0, 0, .3); display: none; }
  .a-pop-r { left: auto; right: 0; }
  .open > .a-pop { display: block; }
  .a-pop button { display: block; width: 100%; padding: 9px 10px; border-radius: 7px; text-align: left; font-size: 14px; }
  .a-pop button:hover { background: var(--accent); }
  .a-more { display: block; width: 100%; height: 54px; margin-top: 40px; border: 1px solid var(--line); border-radius: var(--r); font-weight: 500; }
  .a-more:hover { border-color: var(--ink); }

  /* категория */
  .a-crumbs { display: flex; gap: 8px; padding: 24px 0 0; font: 12px var(--mono); color: var(--muted); }
  .a-crumbs b { font-weight: 500; color: var(--ink); }
  .a-crumbs a:hover { color: var(--ink); }
  .a-cat-head { display: grid; grid-template-columns: 1fr minmax(0, 480px); gap: 32px; align-items: end; padding: 28px 0 32px; }
  .a-cat-head h1 { font-size: clamp(40px, 6vw, 72px); line-height: 1; letter-spacing: -.05em; font-weight: 600; }
  .a-cat-head sup { margin-left: 10px; font: 500 13px var(--mono); letter-spacing: 0; color: var(--muted); vertical-align: top; position: relative; top: .6em; }
  .a-subs { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--ink); margin-bottom: 8px; }
  .a-subs a { display: flex; justify-content: space-between; align-items: baseline; padding: 13px 12px 13px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .a-subs a:hover span { box-shadow: 0 -8px 0 var(--accent) inset; }
  .a-proof { display: flex; justify-content: space-between; align-items: center; gap: 24px; margin: 8px 0 28px; padding: 14px 16px; border-radius: 12px; background: var(--ink); color: var(--on-ink-muted); font-size: 13px; line-height: 1.5; }
  .a-proof b { color: var(--accent); font-weight: 500; }
  .a-proof-tabs { display: flex; gap: 4px; flex-shrink: 0; font: 12px var(--mono); }
  .a-proof-tabs a { padding: 8px 12px; border-radius: 7px; border: 1px solid var(--on-ink-line); }
  .a-proof-tabs a[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--ink); }

  /* карточка товара */
  .a-pdp { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 48px; align-items: start; margin-top: 20px; }
  .a-gallery-main { position: relative; overflow: hidden; border-radius: 16px; }
  .a-gallery-main .ph { aspect-ratio: 4 / 3; background-size: contain; background-color: var(--ph); }
  .a-gallery-main .a-fav { top: 14px; right: 14px; width: 42px; height: 42px; font-size: 20px; border-radius: 10px; }
  .a-thumbs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 8px; }
  .a-thumbs button { overflow: hidden; border-radius: 8px; opacity: .55; outline: 1.5px solid transparent; outline-offset: 2px; transition: .15s; }
  .a-thumbs button.on, .a-thumbs button:hover { opacity: 1; }
  .a-thumbs button.on { outline-color: var(--ink); }
  .a-thumbs .ph { aspect-ratio: 1; }
  .a-buy { position: sticky; top: 128px; }
  .a-buy h1 { font-size: 30px; line-height: 1.1; letter-spacing: -.035em; font-weight: 600; }
  .a-sub { margin-top: 8px; font-size: 14px; color: var(--muted); }
  .a-price { margin-top: 22px; }
  .a-price strong { font-size: 44px; letter-spacing: -.05em; font-weight: 600; line-height: 1; }
  .a-fair { margin: 18px 0 24px; }
  .a-fair-bar { position: relative; height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--good-bar, var(--accent)) 0 33%, var(--line) 33% 66%, var(--line-strong) 66%); }
  .a-fair-bar i { position: absolute; top: -5px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: var(--ink); border: 3px solid var(--bg); }

  /* ===== верхняя панель ===== */
  .m-body { min-height: calc(100vh - 40px); padding: 0 32px 0 128px; }
  .m-top { position: sticky; top: 40px; z-index: 40; display: flex; align-items: center; gap: 16px; max-width: 1320px; height: 76px; margin: 0 auto; background: color-mix(in srgb, var(--m-surface) 88%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
  .m-brand { display: inline-flex; align-items: center; gap: 10px; margin-right: 24px; font-size: 22px; font-weight: 700; letter-spacing: .06em; color: var(--m-on-surface); }
  .m-brand-mark { width: 30px; height: 30px; background: var(--m-primary); transition: transform .6s var(--m-spring); } .m-brand:hover .m-brand-mark { transform: rotate(40deg) scale(1.08); }
  .m-top-fill { flex: 1; }
  .m-searchbar { position: relative; display: flex; align-items: center; flex: 1; min-width: 0; max-width: 640px; height: 52px; padding: 0 6px 0 18px; border-radius: 26px; background: var(--m-sc-high); transition: background .2s, box-shadow .2s; }
  .m-searchbar > .msi { color: var(--m-on-surface-v); } .m-searchbar input { flex: 1; min-width: 0; height: 100%; padding: 0 12px; border: 0; background: none; outline: 0; font-size: 16px; color: var(--m-on-surface); } .m-searchbar input::placeholder { color: var(--m-on-surface-v); }
  .m-searchbar:focus-within { background: var(--m-sc-lowest); box-shadow: 0 0 0 2px var(--m-primary); }
  .m-icbtn { width: 40px; height: 40px; display: grid; place-items: center; flex-shrink: 0; border-radius: 50%; color: var(--m-on-surface-v); transition: border-radius .35s var(--m-spring), box-shadow .2s; } .m-icbtn:hover { box-shadow: var(--m-hover); } .m-icbtn:active { border-radius: 12px; }
  .m-icbtn-tonal { width: 48px; height: 48px; background: var(--m-sc-high); color: var(--m-on-surface); }
  .m-go { width: 52px; height: 52px; display: grid; place-items: center; flex-shrink: 0; border-radius: 26px; background: var(--m-primary); color: var(--m-on-primary); transition: border-radius .35s var(--m-spring), width .35s var(--m-spring); } .m-go:hover { width: 64px; box-shadow: var(--m-hover-on); } .m-go:active { border-radius: 14px; }
  .m-chip { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px 0 12px; border-radius: 20px; background: var(--m-sc-high); font-size: 14px; font-weight: 500; color: var(--m-on-surface); white-space: nowrap; transition: border-radius .35s var(--m-spring), box-shadow .2s; } .m-chip .msi { font-size: 20px; color: var(--m-primary); } .m-chip:hover { box-shadow: var(--m-hover); } .m-chip:active { border-radius: 10px; }
  .m-chip-sugg { padding: 0 16px; background: var(--m-sc-lowest); box-shadow: inset 0 0 0 1px var(--m-outline-v); color: var(--m-on-surface-v); } .m-chip-sugg:hover { box-shadow: inset 0 0 0 1px var(--m-outline-v), var(--m-hover); }
  .m-top .m-chip-geo { margin-left: auto; }
  .m-avatar { width: 44px; height: 44px; display: grid; place-items: center; flex-shrink: 0; border-radius: 50%; background: var(--m-tertiary-c); color: var(--m-on-tertiary-c); font-size: 17px; font-weight: 700; } .m-avatar-lg { width: 52px; height: 52px; border-radius: 0; background: var(--m-good-c); color: var(--m-on-good-c); font-size: 18px; }

  /* ===== плавающая панель навигации + FAB ===== */
  .m-dockzone { position: fixed; left: 20px; top: 50%; z-index: 60; display: flex; flex-direction: column; align-items: center; gap: 14px; transform: translateY(-40%); }
  .m-fab { display: grid; justify-items: center; align-content: center; gap: 2px; width: 80px; height: 80px; border-radius: 24px; background: var(--m-primary); color: var(--m-on-primary); font-size: 12px; font-weight: 600; box-shadow: var(--m-e2); transition: border-radius .45s var(--m-spring), transform .45s var(--m-spring), box-shadow .2s; }

/* Общее ядро прототипа: рендер экранов, разбор запроса, мелкие взаимодействия.

(function () {
  const params = new URLSearchParams(location.search);

  const SCREENS = { home: "Главная", category: "Категория", search: "Поиск", product: "Объявление", sell: "Подача", favorites: "Избранное", chats: "Чаты", profile: "Профиль", seller: "Продавец", checkout: "Оформление" };
  const THEMES = { lime: "Лайм", ruby: "Рубин", night: "Ночь", dock: "Док", apple: "Apple", google: "Google" };
  const BAR = ["home", "category", "search", "product", "sell", "favorites", "chats", "profile"]; // экраны в служебной панели

  /* ---------- состояние прототипа: избранное, чаты, город — живёт в localStorage, чтобы экраны были связаны ---------- */
  const mem = {};
  const state = {
    get(key, def) { try { const v = localStorage.getItem(`ruberi:${key}`); if (v !== null) return JSON.parse(v); } catch {} return key in mem ? mem[key] : def; },
    set(key, val) { mem[key] = val; try { localStorage.setItem(`ruberi:${key}`, JSON.stringify(val)); } catch {} return val; },
  };
  const screen = document.body.dataset.screen || "home";

  /* ---------- тема дизайна: одна разметка, три визуальных языка (themes.css) ---------- */
  let theme = params.get("theme") || state.get("theme", "lime"); if (!THEMES[theme]) theme = "lime";

  document.documentElement.dataset.theme = theme;

  /* ---------- светлая / тёмная: отдельно от дизайна, у каждого дизайна своя тёмная палитра (themes-dark.css).
     «Как в системе» следит за настройкой ОС. «Ночь» тёмная по определению — переключатель там не нужен. ---------- */
  const MODES = ["light", "dark", "auto"];
  let mode = params.get("mode") || state.get("mode", "light"); if (!MODES.includes(mode)) mode = "light";
  if (params.get("mode") && params.get("embed") !== "1") state.set("mode", mode);
  const sysDark = matchMedia("(prefers-color-scheme: dark)");
  const isDark = () => theme === "night" || mode === "dark" || (mode === "auto" && sysDark.matches);
  function applyMode() {
    const dark = isDark(), fixed = theme === "night";
    document.documentElement.dataset.mode = dark ? "dark" : "light";
    document.querySelectorAll("[data-mode-btn]").forEach((b) => { b.setAttribute("aria-pressed", String(dark)); b.disabled = fixed; b.title = fixed ? "«Ночь» — всегда тёмная" : dark ? "Включить светлую тему" : "Включить тёмную тему"; });
    document.querySelectorAll("[data-mode-set]").forEach((b) => { b.setAttribute("aria-selected", String(!fixed && b.dataset.modeSet === mode)); b.disabled = fixed; });
    document.querySelectorAll("[data-mode-hint]").forEach((el) => { el.hidden = !fixed; });
  }
  const setMode = (m) => { mode = m; state.set("mode", m); applyMode(); };
  applyMode();
  sysDark.addEventListener("change", applyMode);
  addEventListener("storage", (e) => { if (e.key === "ruberi:mode") { try { mode = JSON.parse(e.newValue) || "light"; } catch {} applyMode(); } }); // рамки телефонов и превью меняются вместе с прототипом

  /* ---------- форматирование ---------- */
  const nf = new Intl.NumberFormat("ru-RU");
  const fmt = (n) => `${nf.format(n)} ₽`.replace(/\u00a0/g, " ");
  const fmtShort = (n) => n >= 1e6 ? `${String(+(n / 1e6).toFixed(n >= 1e7 ? 1 : 2)).replace(".", ",")} млн ₽` : fmt(n);
  const count = (n) => nf.format(n).replace(/\u00a0/g, " ");
  const countShort = (n) => n >= 1e6 ? `${String(+(n / 1e6).toFixed(1)).replace(".", ",")} млн` : n >= 1e3 ? `${Math.round(n / 1e3)} тыс.` : String(n);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const walk = (km) => km <= 1.5 ? `${Math.max(3, Math.round(km * 12))} мин пешком` : `${String(km).replace(".", ",")} км`;
  const kmText = (km) => `${String(km).replace(".", ",")} км`;

  const ASSET = (window.ASSET_BASE || "assets/");

      : `background-image:url('${im}')`;
    return `<div class="ph ${cls}" style="${style}" role="img" aria-label="${esc(p.title || "")}"></div>`;
  };

  /* ---------- ссылки ---------- */
  const href = (scr, extra = {}) => {
    const q = new URLSearchParams(extra);
    if (params.get("embed") === "live") q.set("embed", "live"); // внутри витрины остаёмся без служебной панели

  /* ---------- разбор запроса на «смысловые» фильтры ---------- */
  const L = "a-zа-яё0-9"; // \b и \w в JS не работают с кириллицей — границы слов задаём сами
  const word = (src) => new RegExp(`(?<![${L}])(?:${src})(?![${L}])`, "gi");
  const DICT = [[word("айфон[а-яё]*|iphone"), "iPhone"], [word("макбук[а-яё]*|macbook"), "MacBook"], [word("про|pro"), "Pro"], [word("макс|max"), "Max"], [word("эйр|air"), "Air"], [word("шкод[а-яё]*|skoda|škoda"), "Škoda"], [word("октави[а-яё]*"), "Octavia"], [word("тойот[а-яё]*"), "Toyota"], [word("гольф[а-яё]*"), "Golf"], [word("плейстейшн|playstation|ps ?5"), "PlayStation 5"]];
  function parse(raw) {
    let s = ` ${raw.toLowerCase()} `;
    const out = [];
    const take = (re, fn) => { s = s.replace(re, (...m) => { const t = fn(...m); if (t) { t.src = m[0].trim(); out.push(t); } return " "; }); };
    const money = (num, unit) => {
      let n = parseFloat(String(num).replace(/\s/g, "").replace(",", "."));
      if (/^(к|k|т|тыс)/.test(unit || "")) n *= 1e3;
      if (/^(м|млн)/.test(unit || "")) n *= 1e6;
      if (!unit && n < 1000) n *= 1e3;
      return n;
    };
    const UNIT = "(к|k|тыс[а-яё]*\\.?|т\\.?р\\.?|млн|м)?";
    take(new RegExp(`\\sдо\\s+(\\d[\\d\\s.,]*)\\s*${UNIT}(?:\\s*(?:руб[а-яё]*\\.?|р\\.?|₽))?(?=\\s)`, "i"), (_, n, u) => ({ type: "price", label: `до ${fmtShort(money(n, u))}`, max: money(n, u) }));
    take(new RegExp(`\\sот\\s+(\\d[\\d\\s.,]*)\\s*${UNIT}(?:\\s*(?:руб[а-яё]*\\.?|р\\.?|₽))?(?=\\s)`, "i"), (_, n, u) => ({ type: "price", label: `от ${fmtShort(money(n, u))}`, min: money(n, u) }));
    take(/\s(рядом|поблизости|недалеко|около дома|возле дома)(?=\s)/i, () => ({ type: "geo", label: "рядом · до 3 км", cycle: "рядом · до 1 км|рядом · до 3 км|рядом · до 5 км|рядом · до 10 км" }));
    take(/\s(?:в\s+)?(москв[аеу]|спб|питер[ае]?|санкт-петербург[ае]?|казан[ьи]|новосибирск[ае]?|екатеринбург[ае]?)(?=\s)/i, (_, c) => ({ type: "geo", label: /моск/.test(c) ? "Москва" : /спб|питер|санкт/.test(c) ? "Санкт-Петербург" : c[0].toUpperCase() + c.slice(1).replace(/[ие]$/, "ь") }));
    take(/\s(с доставкой|доставка|доставкой)(?=\s)/i, () => ({ type: "opt", label: "с доставкой" }));
    take(/\s(нов(ый|ая|ое|ые)|в упаковке|запечатан[а-яё]*)(?=\s)/i, () => ({ type: "opt", label: "новое" }));
    take(/\s(б\/у|бу|с пробегом)(?=\s)/i, () => ({ type: "opt", label: "б/у" }));
    take(/\s(сегодня|срочно)(?=\s)/i, () => ({ type: "opt", label: "можно забрать сегодня" }));
    take(/\s(\d{2,4})\s*(гб|gb|тб|tb)(?=\s)/i, (_, n, u) => ({ type: "attr", label: `${n} ${/т/i.test(u) ? "ТБ" : "ГБ"}` }));
    let what = s.replace(/\s+/g, " ").trim();
    const whatSrc = what;
    if (what) { what = what[0].toUpperCase() + what.slice(1); DICT.forEach(([re, to]) => { what = what.replace(re, to); }); out.unshift({ type: "what", label: what, src: whatSrc }); }
    return out;
  }

  /* ---------- поиск по демо-данным: запрос → чипы → отфильтрованный список ---------- */
  const CAT_WORDS = { phones: "смартфон телефон apple электроника", laptops: "ноутбук компьютер apple электроника", audio: "наушники аудио электроника", photo: "фото камера фотоаппарат электроника", games: "игры приставка консоль электроника", home: "дом сад мебель интерьер", fashion: "одежда обувь аксессуары", hobby: "хобби музыка спорт", sport: "спорт хобби вело", cars: "авто автомобиль автомобили машина транспорт пробегом", flats: "квартира квартиры недвижимость жильё купить" };
  const stem = (w) => w.length > 6 ? w.slice(0, -2) : w.length > 4 ? w.slice(0, -1) : w;
  function find(q) {
    const tokens = parse(q || "");
    const what = (tokens.find((t) => t.type === "what") || {}).label || "";
    const words = what.toLowerCase().split(/[\s,]+/).filter((w) => w.length > 1 && !["для", "или", "на", "по", "из"].includes(w)).map(stem);
    const hay = (p) => `${p.title} ${p.sub || ""} ${CAT_WORDS[p.cat] || ""}`.toLowerCase();
    let list = DB.products.map((p) => ({ p, score: words.filter((w) => hay(p).includes(w)).length }));
    const full = list.filter((x) => x.score === words.length);
    list = (words.length && !full.length ? list.filter((x) => x.score > 0).sort((a, b) => b.score - a.score) : full).map((x) => x.p);
    const price = tokens.filter((t) => t.type === "price");
    price.forEach((t) => { list = list.filter((p) => (t.max ? p.price <= t.max : true) && (t.min ? p.price >= t.min : true)); });
    if (tokens.some((t) => t.type === "geo" && /рядом/.test(t.label))) list = list.filter((p) => p.km <= 3);
    if (tokens.some((t) => t.label === "с доставкой")) list = list.filter((p) => p.delivery);
    if (tokens.some((t) => t.label === "новое")) list = list.filter((p) => /нов/i.test(p.cond));
    return { list, what, tokens };
  }

  /* ---------- продавцы, характеристики, цена к рынку ---------- */
  const SELLERS = [
    { id: "s1", name: "Анна К.", ini: "АК", rate: "4,9", deals: 38, since: 2021, reply: "~10 мин", dat: "Анне" },
    { id: "s2", name: "Тимур Р.", ini: "ТР", rate: "5,0", deals: 12, since: 2023, reply: "~25 мин", dat: "Тимуру" },
    { id: "s3", name: "Мария В.", ini: "МВ", rate: "4,8", deals: 104, since: 2019, reply: "~5 мин", dat: "Марии" },
  ];
  const seller = (p) => SELLERS[(p.id.charCodeAt(0) + p.id.length + p.price) % SELLERS.length];
  const FAIR = { ok: { label: "Цена в рынке", pos: 50 }, low: { label: "Ниже рынка", pos: 20 }, high: { label: "Выше рынка", pos: 84 } };
  const fair = (p) => { const f = FAIR[p.fair || "ok"]; const mid = p.price / (1 + (f.pos - 50) / 170); return { ...f, from: Math.round(mid * 0.86 / 100) * 100, to: Math.round(mid * 1.16 / 100) * 100, key: p.fair || "ok" }; };
  function specs(p) {
    if (p.cat === "phones") return { top: [["Память", (p.title.match(/\d+ ГБ/) || ["256 ГБ"])[0]], ["Состояние", p.cond], ["Аккумулятор", (p.sub || "").match(/АКБ (\d+%)/)?.[1] || "90%"], ["Цвет", (p.sub || "Графит").split(" · ")[0]], ["Комплект", "Коробка, кабель"], ["Гарантия", "Нет"]], rest: 12 };
    if (p.cat === "cars") { const s = (p.sub || "").split(" · "); return { top: [["Год", (p.title.match(/\d{4}/) || ["—"])[0]], ["Пробег", p.cond], ["Двигатель", s[0] || "—"], ["Мощность", s[1] || "—"], ["Кузов / привод", s[2] || "—"], ["Владельцев", "1"]], rest: 48 }; }
    if (p.cat === "flats") { const t = p.title.split(", "); return { top: [["Комнат", t[0]], ["Площадь", t[1]], ["Этаж", t[2]], ["До метро", p.cond], ["Дом", (p.sub || "").split(" · ")[0]], ["Ремонт", (p.sub || "").split(" · ")[1] || "—"]], rest: 29 }; }
    return { top: [["Состояние", p.cond], ["Размещено", p.when], ["Доставка", p.delivery ? "Есть" : "Только самовывоз"], ["Район", p.place]], rest: 6 };
  }
  const MORE = { phones: [["Экран", "6,1″ OLED, 120 Гц"], ["SIM", "nano-SIM + eSIM"], ["Год выпуска", "2021"], ["Ремонты", "Не было"], ["Face ID", "Работает"], ["Чек", "Есть"], ["Торг", "Небольшой"], ["Обмен", "Нет"]],
    cars: [["Руль", "Левый"], ["Цвет", "Красный"], ["ПТС", "Оригинал"], ["Растаможен", "Да"], ["Комплектация", "Style"], ["Резина", "Два комплекта"], ["Сервисная книжка", "Есть"], ["Торг", "У капота"], ["Обмен", "Нет"]],
    flats: [["Санузел", "Раздельный"], ["Балкон", "Есть"], ["Высота потолков", "2,7 м"], ["Лифт", "Пассажирский"], ["Парковка", "Во дворе"], ["Год постройки", "1998"], ["Ипотека", "Возможна"], ["Мебель", "Остаётся кухня"]] };
  const specsFull = (p) => { const s = specs(p); return { ...s, more: MORE[p.cat] || [["Торг", "Уместен"], ["Обмен", "Нет"], ["Причина продажи", "Не пользуюсь"]] }; };
  const describe = (p) => p.cat === "cars" ? "Машина в отличном состоянии, обслуживалась у официального дилера, все ТО по регламенту. Не бита, не крашена, два комплекта резины. Покажу в любой день, возможна проверка на сервисе покупателя."
    : p.cat === "flats" ? "Светлая квартира в тихом дворе. Сделан ремонт, остаётся кухня и встроенная мебель. Один взрослый собственник, свободная продажа, документы готовы. Показы по вечерам и в выходные."
    : "Пользовались аккуратно, всё работает как должно. Без ремонтов и скрытых дефектов, все мелкие следы использования видны на фото. Проверка при встрече — сколько нужно. Отдам с полным комплектом.";
  const related = (p, n = 4) => DB.products.filter((x) => x.cat === p.cat && x.id !== p.id).concat(DB.products.filter((x) => x.cat !== p.cat)).slice(0, n);

  /* ---------- панель «все фильтры» (красится CSS-переменными темы) ---------- */
  function filterSheet(schema, forSell = false) {
    const extra = { phones: ["Цвет", "Аккумулятор", "SIM", "Гарантия", "Комплект", "Год выпуска", "Экран", "Продавец", "Торг", "Обмен", "Рейтинг продавца", "Срок размещения", "Только с фото", "Безопасная сделка"],
      cars: ["Кузов", "Привод", "Двигатель", "Объём", "Мощность", "Владельцы", "ПТС", "Цвет", "Руль", "Состояние", "Растаможен", "Торг", "Обмен", "Продавец"],
      flats: ["Тип дома", "Ремонт", "Балкон", "Санузел", "Парковка", "Лифт", "Высота потолков", "Год постройки", "Ипотека", "Продавец", "Вид из окон", "Мебель", "Техника", "Торг"] };
    const key = Object.keys(DB.schemas).find((k) => DB.schemas[k] === schema) || "phones";
    const rows = schema.top.map((f) => `<details class="sheet-row" open><summary>${f.label}<i></i></summary><div class="sheet-opts">${f.options.map((o) => `<button type="button" data-toggle>${o}</button>`).join("")}</div></details>`).join("")
      + extra[key].map((n) => `<details class="sheet-row"><summary>${n}<i></i></summary><div class="sheet-opts"><button type="button" data-toggle>Любой</button><button type="button" data-toggle>Указать…</button></div></details>`).join("");
    return `<div class="sheet" data-sheet aria-hidden="true"><button class="sheet-scrim" type="button" data-sheet-close aria-label="Закрыть"></button>
      <aside class="sheet-panel" role="dialog" aria-modal="true" aria-label="Все фильтры">
        <header><strong>${forSell ? "Необязательные характеристики" : "Все фильтры"}</strong><button type="button" data-sheet-close aria-label="Закрыть">✕</button></header>
        <label class="sheet-find"><input type="search" placeholder="Найти фильтр: «привод», «балкон», «АКБ»…" data-sheet-find /></label>
        <p class="sheet-note">Сверху — то, чем пользуются чаще всего в «${schema.name}». Остальные ${schema.rest} характеристик свёрнуты и ищутся по названию.</p>
        <div class="sheet-list">${rows}</div>
        <footer><button type="button" class="sheet-reset" data-sheet-close>Сбросить</button><button type="button" class="sheet-apply" data-sheet-close>${forSell ? "Готово" : `Показать ${count(Math.round(schema.count / 9000))} объявлений`}</button></footer>
      </aside></div>`;
  }

  /* ---------- служебная панель прототипа: переходы между экранами ---------- */
  function conceptBar() {
    const bar = document.createElement("div");
    bar.className = "cbar";
    bar.innerHTML = `<a class="cbar-home" href="../index.html" title="О прототипе">◆ RUBERI · прототип</a>
      <a href="mobile.html">Телефон</a><a href="system.html">Дизайн-система</a>
      <button type="button" class="cbar-mode" data-mode-btn aria-pressed="false"><i aria-hidden="true"></i>Тёмная</button>
      <div class="cbar-group" role="tablist" aria-label="Дизайн">${Object.entries(THEMES).map(([k, n]) => `<button type="button" role="tab" aria-selected="${k === theme}" data-theme-btn="${k}">${n}</button>`).join("")}</div>
      <nav class="cbar-screens" aria-label="Экран">${BAR.map((k) => [k, SCREENS[k]]).map(([k, n]) => `<a href="${k}.html" data-screen-link="${k}" ${k === screen ? 'aria-current="page"' : ""}>${n}</a>`).join("")}</nav>`;
    document.body.prepend(bar);
  }
  function syncBarLinks() {
    document.querySelectorAll("[data-screen-link]").forEach((a) => {
      const keep = new URLSearchParams(location.search); keep.delete("v");
      if (a.dataset.screenLink !== screen) { ["id", "q", "c", "kind", "demo"].forEach((k) => keep.delete(k)); }
      const qs = keep.toString(); a.href = `${a.dataset.screenLink}.html${qs ? `?${qs}` : ""}`;
    });
  }

  /* ---------- рендер ---------- */
  function render() {
    document.documentElement.dataset.variant = "a"; // стили прототипа заскоуплены под [data-variant="a"]
    const v = window.V.a;
    const ctx = { params, q: params.get("q") || DB.demoQuery, schemaKey: DB.schemas[params.get("c")] ? params.get("c") : "phones", product: DB.byId(params.get("id")) || DB.byId("ip1") };
    ctx.schema = DB.schemas[ctx.schemaKey];
    const app = document.getElementById("app"); app.innerHTML = v[screen](ctx);
    // панель «все фильтры» строится из схемы той категории, которая сейчас на экране
    const sheetSchema = screen === "category" ? ctx.schema : screen === "search" ? DB.schemas[app.querySelector("[data-schema]")?.dataset.schema || "phones"] : screen === "sell" ? DB.schemas[{ car: "cars", flat: "flats" }[params.get("kind")] || "phones"] : null;
    if (sheetSchema) app.insertAdjacentHTML("beforeend", filterSheet(sheetSchema, screen === "sell"));
    document.title = `${SCREENS[screen]} · RUBERI`;
    syncBarLinks();
    syncFavs();
    bindParsers();
    bindTyper();
    v.init?.(screen, ctx);
    window.scrollTo(0, 0);
  }

  /* живой разбор запроса: input[data-parse] → [data-parse-out] */
  function chipsHTML(tokens) {
    // data-key — устойчивый ключ чипа: «что ищем», цена и гео живут по типу (их текст меняется по мере набора), остальные — по значению
    const seen = {};
    return tokens.map((t) => {
      let key = ["what", "price", "geo"].includes(t.type) ? t.type : `${t.type}:${t.label}`;
      seen[key] = (seen[key] || 0) + 1; if (seen[key] > 1) key += `#${seen[key]}`;
      return `<span class="tok tok-${t.type}" data-tok data-key="${esc(key)}" data-label="${esc(t.label)}" data-src="${esc(t.src || "")}">${t.cycle ? `<button type="button" class="tok-cycle" data-cycle="${esc(t.cycle)}" title="Нажмите, чтобы изменить радиус">${esc(t.label)}</button>` : esc(t.label)}<button type="button" aria-label="Убрать" data-tok-x>×</button></span>`;
    }).join("");
  }
  /* Обновляем чипы точечно, а не через innerHTML: иначе на каждую букву все чипы пересоздаются
     и заново проигрывают анимацию появления (моргают). Анимируется только реально новый чип. */
  function reconcile(out, html) {
    const tpl = document.createElement("template"); tpl.innerHTML = html;
    const want = [...tpl.content.children];
    const have = new Map([...out.children].map((el) => [el.dataset.key, el]));
    let cursor = out.firstElementChild;
    want.forEach((next) => {
      const old = have.get(next.dataset.key);
      if (old) {
        have.delete(next.dataset.key);
        if (old.dataset.label !== next.dataset.label) { old.innerHTML = next.innerHTML; old.dataset.label = next.dataset.label || ""; }
        if (next.dataset.src !== undefined) old.dataset.src = next.dataset.src;
        if (old === cursor) cursor = cursor.nextElementSibling; else out.insertBefore(old, cursor);
      } else out.insertBefore(next, cursor);
    });
    have.forEach((el) => el.remove());
  }
  function addHTML(tokens) {
    const has = (type, re) => tokens.some((t) => t.type === type && (!re || re.test(t.label)));
    const add = [];
    if (!has("price")) add.push(["цена", " до "]);
    if (!has("geo")) add.push(["рядом", " рядом"]);
    if (!has("opt", /достав/)) add.push(["с доставкой", " с доставкой"]);
    if (!has("opt", /нов|б\/у/)) add.push(["только новое", " новый"]);
    return add.map(([label, text]) => `<button type="button" class="tok-add" data-key="add:${label}" data-label="${label}" data-append="${esc(text)}">+ ${label}</button>`).join("");
  }
  function bindParsers() {
    document.querySelectorAll("[data-parse]").forEach((input) => {
      const out = document.querySelector(input.dataset.parse);
      const upd = () => { const t = parse(input.value); reconcile(out, chipsHTML(t) + (input.type !== "hidden" && t.some((x) => x.type === "what") ? addHTML(t) : "")); out.closest("[data-parse-wrap]")?.classList.toggle("has-tokens", t.length > 0); };
      input.addEventListener("input", upd); upd();
    });
  }

  /* «печатающая» строка: пока человек не тронул поле, показываем на примерах, как писать запрос */
  let typerTimer;
  function bindTyper() {
    clearTimeout(typerTimer);
    const input = document.querySelector("[data-typer]"); if (!input) return;
    const samples = input.dataset.typer.split("|"); let i = 0, n = 0, dir = 1, stopped = false;
    const fire = () => input.dispatchEvent(new Event("input", { bubbles: true }));
    const stop = () => { if (stopped) return; stopped = true; clearTimeout(typerTimer); input.value = ""; fire(); };
    input.addEventListener("focus", stop, { once: true });
    const tick = () => {
      if (stopped || !input.isConnected) return;
      const s = samples[i]; n += dir; input.value = s.slice(0, n); fire();
      let wait = dir > 0 ? 55 : 18;
      if (n === s.length) { dir = -1; wait = 2600; } else if (n === 0) { dir = 1; i = (i + 1) % samples.length; wait = 500; }
      typerTimer = setTimeout(tick, wait);
    };
    if (matchMedia("(prefers-reduced-motion: reduce)").matches || embed) { input.value = samples[0]; fire(); return; }
    typerTimer = setTimeout(tick, 600);
  }

  const FAVS0 = ["canon1", "bike", "ip3"]; // стартовый набор, чтобы «Избранное» не было пустым при первом заходе
  function syncFavs() { const favs = state.get("favs", FAVS0); document.querySelectorAll("[data-fav]").forEach((b) => { if (b.dataset.fav) b.classList.toggle("on", favs.includes(b.dataset.fav)); }); }

  let toastTimer;
  function toast(msg) {
    let t = document.querySelector(".toast");
    if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.append(t); }
    t.textContent = msg; t.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), 2200);
  }

  document.addEventListener("click", (e) => {
    const mb = e.target.closest("[data-mode-btn]"); if (mb) { setMode(isDark() ? "light" : "dark"); return; }
    const ms = e.target.closest("[data-mode-set]"); if (ms) { setMode(ms.dataset.modeSet); return; }
    const tb = e.target.closest("[data-theme-btn]"); if (tb) {
      const LAYOUTS = ["dock", "apple", "google"]; const relayout = LAYOUTS.includes(theme) || LAYOUTS.includes(tb.dataset.themeBtn); // у этих дизайнов своя разметка
      theme = tb.dataset.themeBtn; state.set("theme", theme); document.documentElement.dataset.theme = theme; if (relayout) render();
      document.querySelectorAll("[data-theme-btn]").forEach((b) => b.setAttribute("aria-selected", String(b === tb))); applyMode();
      const q = new URLSearchParams(location.search); if (q.has("theme")) { q.delete("theme"); const qs = q.toString(); history.replaceState(null, "", qs ? `?${qs}` : location.pathname); }
      return;
    }
    const fav = e.target.closest("[data-fav]"); if (fav) {
      e.preventDefault(); const id = fav.dataset.fav; const on = !fav.classList.contains("on");
      if (id) { const favs = state.get("favs", FAVS0).filter((x) => x !== id); if (on) favs.unshift(id); state.set("favs", favs); syncFavs(); document.dispatchEvent(new CustomEvent("favs-changed")); } else fav.classList.toggle("on");
      return toast(on ? "В избранном" : "Убрано из избранного");
    }
    const tx = e.target.closest("[data-tok-x]"); if (tx) {
      e.preventDefault(); const tok = tx.closest("[data-tok]"); const input = tok.closest("[data-parse-wrap]")?.querySelector("[data-parse]");
      if (input && tok.dataset.src) {
        // слова токена могут стоять в запросе не подряд («айфон до 60к про») — убираем по одному
        let v = ` ${input.value.toLowerCase()} `; tok.dataset.src.split(" ").forEach((w) => { v = v.replace(` ${w} `, " "); });
        input.value = v.replace(/\s+/g, " ").trim(); input.dispatchEvent(new Event("input", { bubbles: true }));
      } else tok.remove();
      return;
    }
    const cyc = e.target.closest("[data-cycle]"); if (cyc) { const opts = cyc.dataset.cycle.split("|"); cyc.textContent = opts[(opts.indexOf(cyc.textContent) + 1) % opts.length]; return; }
    const ap = e.target.closest("[data-append]"); if (ap) { const input = ap.closest("[data-parse-wrap]").querySelector("[data-parse]"); input.focus(); input.value = input.value.trimEnd() + ap.dataset.append; input.dispatchEvent(new Event("input", { bubbles: true })); return; }
    const tg = e.target.closest("[data-toggle]"); if (tg) { const grp = tg.closest("[data-single]"); if (grp) grp.querySelectorAll("[data-toggle]").forEach((b) => b !== tg && b.classList.remove("on")); return tg.classList.toggle("on"); }
    const so = e.target.closest("[data-sheet-open]"); if (so) { const s = document.querySelector("[data-sheet]"); s.classList.add("open"); s.setAttribute("aria-hidden", "false"); return; }
    const sc = e.target.closest("[data-sheet-close]"); if (sc) { const s = document.querySelector("[data-sheet]"); s.classList.remove("open"); s.setAttribute("aria-hidden", "true"); return; }
    const th = e.target.closest("[data-thumb]"); if (th) { const main = document.querySelector("[data-main-photo]"); main.style.cssText = th.querySelector(".ph").style.cssText; document.querySelectorAll("[data-thumb]").forEach((b) => b.classList.toggle("on", b === th)); return; }
    const pop = e.target.closest("[data-pop]"); document.querySelectorAll("[data-pop].open").forEach((x) => x !== pop && x.classList.remove("open"));
    if (pop && !e.target.closest("[data-pop-body]")) pop.classList.toggle("open");
    const opt = e.target.closest("[data-pop-opt]"); if (opt) { const host = opt.closest("[data-pop]"); host.querySelector("[data-pop-val]").textContent = opt.textContent; host.classList.add("set"); host.classList.remove("open"); }
    const fill = e.target.closest("[data-fill]"); if (fill) { const input = document.querySelector("[data-parse]"); input.focus(); input.value = fill.dataset.fill; input.dispatchEvent(new Event("input", { bubbles: true })); return; }
    const ts = e.target.closest("[data-toast]"); if (ts) toast(ts.dataset.toast);
  });
  document.addEventListener("input", (e) => {
    if (e.target.matches("[data-sheet-find]")) { const q = e.target.value.trim().toLowerCase(); document.querySelectorAll(".sheet-row").forEach((r) => { r.hidden = q && !r.querySelector("summary").textContent.toLowerCase().includes(q); }); }
    if (e.target.matches("[data-radius]")) { const steps = [1, 3, 5, 10, 25]; const v = steps[e.target.value]; document.querySelectorAll("[data-radius-out]").forEach((o) => { o.textContent = `${v} км`; }); }
  });
  document.addEventListener("submit", (e) => {
    const f = e.target.closest("[data-search]"); if (!f) return;
    e.preventDefault(); const q = f.querySelector("input").value.trim();
    location.href = href("search", q ? { q } : {});
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") document.querySelector("[data-sheet].open [data-sheet-close]")?.click(); });

  window.UI = { fmt, fmtShort, count, countShort, esc, walk, kmText, photo, href, parse, find, chipsHTML, seller, SELLERS, fair, specs: specsFull, describe, related, toast, state, FAVS0, screen, params, mode: () => mode, applyMode };
  window.V = window.V || {};
  const embed = params.has("embed"); // режим превью для обзорной страницы: без служебной панели
  window.addEventListener("DOMContentLoaded", () => { if (embed) document.documentElement.classList.add("embed", params.get("embed") === "live" ? "embed-live" : "embed-static"); else conceptBar(); render(); applyMode(); });
})();

  </script>

              <div class="a-attr-ask">${K.ask}</div>
              <button type="button" class="a-pill-more" data-sheet-open>Ещё ${s.rest - (kind === "car" ? 6 : 0)} необязательных</button>
            </div></div>
            <div class="a-field"><span>Цена</span>
              <div class="a-price-row"><input inputmode="numeric" value="${U().fmt(K.price).replace(" ₽", "")}" data-sell-price data-from="${f.from}" data-to="${f.to}" aria-label="Цена" /><b>₽</b></div>
              <div class="a-fair"><div class="a-fair-bar"><i style="left:50%" data-sell-dot></i></div><div class="a-fair-legend"><span>${U().fmtShort(f.from)}</span><b data-sell-verdict>Цена в рынке</b><span>${U().fmtShort(f.to)}</span></div></div>
              <div class="a-presets" data-single>${["Быстрее", "В рынке", "Не спешу"].map((n, i) => `<button type="button" data-toggle data-sell-preset="${K.presets[i]}" class="${i === 1 ? "on" : ""}"><small>${n}</small>${U().fmtShort(K.presets[i])}</button>`).join("")}</div>
            </div>
            <label class="a-field"><span>Описание</span><textarea rows="4">${K.text}</textarea></label>
            <div class="a-field"><span>Где и как</span><div class="a-attrs">${K.how.map(([k, v]) => `<button type="button" class="ok" data-pick="${U().esc([k, v, "Изменить…", "Отключить"].join("|"))}"><small>${k}</small><span data-pick-val>${v}</span></button>`).join("")}</div></div>
            <div class="a-form-actions"><button type="submit" class="a-cta">Опубликовать</button><button type="button" class="a-cta2" data-sell-draft>В черновики</button></div>
          </form>
        </section>

        <section class="a-done" data-sell-step="4" hidden>
          <i>✓</i>
          <h1>Опубликовано.</h1>
          <p>Объявление «<b data-done-title>${K.title}</b>» уже в поиске. Когда кто-нибудь напишет или добавит его в избранное, мы пришлём уведомление.</p>
          <div class="a-done-card"><div class="ph" data-sell-photo></div><div><b data-done-title>${K.title}</b><strong data-done-price>${U().fmt(K.price)}</strong><small>Хамовники · только что</small></div></div>
          <div class="a-empty-actions"><a class="a-cta" href="${U().href("product", { id: K.product.id })}">Посмотреть объявление</a><a class="a-cta2" href="${U().href("profile")}">Мои объявления</a><a class="a-cta2" href="${U().href("sell")}">Продать ещё</a></div>
        </section>
      </main>${footer()}`;
    },

    init(screen) {
      if (screen !== "sell") return;
      const root = document.querySelector("[data-sell-kind]");
      const demoBg = root.dataset.sellImg ? `url('${root.dataset.sellImg}')` : "";
      const step = (n) => document.querySelectorAll("[data-sell-step]").forEach((el) => { el.hidden = el.dataset.sellStep !== String(n); });
      const paint = (bg) => document.querySelectorAll("[data-sell-photo]").forEach((el) => { el.style.backgroundImage = bg; });
      const start = (bg) => {
        paint(bg); step(2); window.scrollTo(0, 0);
        const lines = [...document.querySelectorAll(".a-scan-log li")]; lines.forEach((l) => l.classList.remove("on"));
        lines.forEach((l, i) => setTimeout(() => l.classList.add("on"), 250 + i * 480));
        setTimeout(() => step(3), 250 + lines.length * 480 + 500);
      };
      // ?demo — сразу показать готовый черновик (для превью и скриншотов)
      if (new URLSearchParams(location.search).has("demo")) { paint(demoBg); step(3); }
      document.querySelector("[data-sell-demo]").addEventListener("click", () => start(demoBg));
      document.querySelector("[data-sell-file]").addEventListener("change", (e) => { const file = e.target.files[0]; if (file) start(`url('${URL.createObjectURL(file)}')`); });
      const price = document.querySelector("[data-sell-price]"), dot = document.querySelector("[data-sell-dot]"), verdict = document.querySelector("[data-sell-verdict]");
      const from = Number(price.dataset.from), to = Number(price.dataset.to);
      const sync = () => {
        const n = Number(price.value.replace(/\D/g, "")) || 0; const pos = Math.max(4, Math.min(96, ((n - from) / (to - from)) * 100));
        dot.style.left = `${pos}%`;
        verdict.textContent = !n ? "Укажите цену" : pos < 33 ? "Ниже рынка — уйдёт быстрее" : pos < 67 ? "Цена в рынке" : "Выше рынка — может продаваться дольше";
      };
      price.addEventListener("input", () => { document.querySelectorAll("[data-sell-preset]").forEach((b) => b.classList.remove("on")); sync(); });
      document.querySelectorAll("[data-sell-preset]").forEach((b) => b.addEventListener("click", () => { price.value = U().fmt(Number(b.dataset.sellPreset)).replace(" ₽", ""); sync(); }));
      document.querySelector("[data-sell-form]").addEventListener("submit", (e) => {
        e.preventDefault(); const title = e.target.querySelector("input").value;
        document.querySelectorAll("[data-done-title]").forEach((el) => { el.textContent = title; }); document.querySelector("[data-done-price]").textContent = `${price.value} ₽`;
        step(4); window.scrollTo(0, 0);
      });
      document.querySelector("[data-sell-draft]").addEventListener("click", () => { const d = U().state.get("drafts", []); d.unshift({ title: document.querySelector(".a-form input").value, price: price.value }); U().state.set("drafts", d); U().toast("Черновик сохранён — он в профиле"); });
      document.querySelector("[data-sell-more]").addEventListener("change", (e) => { const box = document.querySelector("[data-sell-thumbs]"); [...e.target.files].slice(0, 8).forEach((f) => { const t = document.createElement("div"); t.className = "ph"; t.style.backgroundImage = `url('${URL.createObjectURL(f)}')`; box.append(t); }); });
      sync();
    },

    product(ctx) {
      const p = ctx.product; const s = U().seller(p); const f = U().fair(p); const sp = U().specs(p);
      const thumbs = [p].concat(DB.products.filter((x) => x.cat === p.cat && x.id !== p.id).slice(0, 3));
      return `${header()}
      <main class="a-main">
        <nav class="a-crumbs"><a href="${U().href("search")}" data-back>← Назад</a><span>/</span><b>№ 482 103 · ${p.when}</b></nav>
        <div class="a-pdp">
          <section class="a-gallery">
            <div class="a-gallery-main">${U().photo(p, "").replace('class="ph "', 'class="ph" data-main-photo')}<button type="button" class="a-fav" data-fav="${p.id}" aria-label="В избранное">♡</button></div>
            <div class="a-thumbs">${thumbs.map((t, i) => `<button type="button" data-thumb class="${i ? "" : "on"}">${U().photo(t)}</button>`).join("")}</div>
          </section>

          <aside class="a-buy">
            <h1>${p.title}</h1>
            ${p.sub ? `<p class="a-sub">${p.sub}</p>` : ""}
            <div class="a-price"><strong>${U().fmt(p.price)}</strong></div>
            <div class="a-fair a-fair-${f.key}"><div class="a-fair-bar"><i style="left:${f.pos}%"></i></div><div class="a-fair-legend"><span>${U().fmtShort(f.from)}</span><b>${f.label}</b><span>${U().fmtShort(f.to)}</span></div></div>
            <a class="a-cta" href="${U().href("chats", { to: p.id })}">Написать ${s.dat}</a>
            <div class="a-quick"><span>Обычно отвечает за ${s.reply} · спросить в один тап</span>${["Ещё продаёте?", "Можно сегодня?", "Торг уместен?"].map((t) => `<a href="${U().href("chats", { to: p.id, msg: t })}">${t}</a>`).join("")}</div>
            ${p.delivery ? `<a class="a-cta2" href="${U().href("checkout", { id: p.id })}">Купить с доставкой · от 390 ₽</a>` : ""}
            <button type="button" class="a-cta2 a-phone" data-phone>Показать телефон</button>
            <ul class="a-facts">
              <li><small>Где</small><span>${p.place} · ${U().walk(p.km)}</span></li>
              <li><small>Состояние</small><span>${p.cond}</span></li>
              <li><small>Сделка</small><span>${p.delivery ? "Деньги продавцу — после проверки" : "Личная встреча"}</span></li>
            </ul>
            <a class="a-seller" href="${U().href("seller", { id: s.id })}"><span class="a-ava">${s.ini}</span><span><b>${s.name}${p.verified ? " <i>проверен</i>" : ""}</b><small>★ ${s.rate} · ${s.deals} сделок · на площадке с ${s.since}</small></span><span>→</span></a>
          </aside>
        </div>

        <div class="a-info">
          <section><h2>Описание</h2><p>${U().describe(p)}</p></section>
          <section><h2>Характеристики</h2>
            <dl class="a-specs">${sp.top.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join("")}${(sp.more || []).map(([k, v]) => `<div hidden data-spec-more><dt>${k}</dt><dd>${v}</dd></div>`).join("")}</dl>
            <button type="button" class="a-link" data-specs-more data-less="Свернуть">Ещё ${(sp.more || []).length} характеристик</button>
          </section>
        </div>

        <section class="a-block"><div class="a-block-head"><h2>Похожие</h2><span>та же модель, ближе и дешевле</span></div><div class="a-grid a-grid-5">${U().related(p, 5).map(card).join("")}</div></section>
      </main>${footer()}
      <div class="a-sticky" ${dockOn() ? "hidden" : ""}><strong>${U().fmtShort(p.price)}</strong><a class="a-cta" href="${U().href("chats", { to: p.id })}">Написать</a></div>`;
    },
  };
})();

  </script>
  <script>
/* Остальные экраны RUBERI: избранное, чаты, профиль, продавец, оформление с доставкой,
   плюс общие модальные окна (город и радиус, выбор значения). Стиль и блоки — те же, что в concept-a.js. */
(function () {
  const U = () => window.UI;
  const A = () => window.V.a._;
  const S = (k, d) => U().state.get(k, d);
  const now = () => new Date().toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });

  /* ---------- стартовые данные ---------- */
  window.SEARCHES0 = [
    { q: "айфон 13 про до 60 тысяч рядом", fresh: 2, notify: true },
    { q: "шкода октавия до 2.5 млн в москве", fresh: 1, notify: false },
  ];
  const CHATS0 = [
    { id: "c1", pid: "ip1", unread: 1, msgs: [{ me: 1, t: "Здравствуйте! Ещё продаёте?", at: "12:04" }, { me: 0, t: "Да, продаю. Могу показать сегодня после 18:00 у метро Спортивная.", at: "12:11" }] },
    { id: "c2", pid: "chair1", unread: 0, msgs: [{ me: 1, t: "Добрый день, кресло ещё актуально?", at: "вчера" }, { me: 0, t: "Да, забирать из Хамовников. Помогу вынести.", at: "вчера" }, { me: 1, t: "Отлично, напишу в субботу утром.", at: "вчера" }] },
    { id: "c3", pid: "guitar", mine: true, who: { name: "Олег Д.", ini: "ОД" }, unread: 1, msgs: [{ me: 0, t: "Добрый день! Торг уместен? Заберу сегодня.", at: "10:40" }] },
  ];
  const chats = () => S("chats", CHATS0);
  window.CHATS = { unread: () => chats().reduce((n, c) => n + (c.unread || 0), 0) };
  const ME = { name: "Константин", ini: "К", rate: "4,9", deals: 14, since: 2022 };
  const MY = { active: [["guitar", 412, 9, 12], ["kbd", 96, 3, 2], ["sneaker", 58, 1, 1]], sold: [["watch2", "12 сентября"], ["canon3", "30 августа"]] };

  const peer = (c) => (c.mine ? c.who : U().seller(DB.byId(c.pid)));
  const REPLIES = [[/торг|скидк|дешевле/i, "Немного уступлю при встрече, если всё устроит."], [/сегодня|когда|завтра/i, "Сегодня после 18:00 удобно. Подойдёт?"], [/ещё прода|актуальн/i, "Да, ещё продаю."], [/где|адрес|встрет/i, "Удобнее всего у метро, точное место напишу ближе ко времени."], [/достав/i, "Да, могу отправить доставкой — оформляйте прямо здесь, через безопасную сделку."]];
  const replyTo = (t) => (REPLIES.find(([re]) => re.test(t)) || [0, "Хорошо, договорились. Пишите, если будут вопросы."])[1];

  /* =========================== ИЗБРАННОЕ =========================== */
  function favorites(ctx) {
    const tab = ctx.params.get("tab") === "searches" ? "searches" : "items";
    const favs = S("favs", U().FAVS0).map(DB.byId).filter(Boolean);
    const searches = S("searches", window.SEARCHES0);
    const chips = (q) => U().parse(q).map((t) => `<span class="tok tok-${t.type}">${U().esc(t.label)}</span>`).join("");
    return `${A().header()}
    <main class="a-main">
      <section class="a-page-head"><h1>Избранное</h1>
        <div class="a-kind" role="tablist"><a href="${U().href("favorites")}" role="tab" aria-selected="${tab === "items"}">Объявления <small>${favs.length}</small></a><a href="${U().href("favorites", { tab: "searches" })}" role="tab" aria-selected="${tab === "searches"}">Слежу за поиском <small>${searches.length}</small></a></div>
      </section>
      ${tab === "items" ? (favs.length ? `<div class="a-grid a-grid-5" data-favs-grid>${favs.map(A().card).join("")}</div>` : empty("Здесь будут объявления, к которым хочется вернуться", "Нажмите ♡ на любой карточке — и она появится тут. Если цена снизится, мы подскажем.", "Смотреть объявления", U().href("home")))
        : `<p class="a-watch-about">Сохраните поиск — и мы будем следить за ним вместо вас: как только появится подходящее объявление, пришлём уведомление. Заходить и проверять самому не нужно.</p>` + (searches.length ? `<ul class="a-watches">${searches.map((s, i) => {
          const found = U().find(s.q).list; const fresh = Math.min(s.fresh || 0, found.length); const link = U().href("search", { q: s.q });
          return `<li class="a-watch" data-search-row="${i}">
            <a class="a-watch-main" href="${link}">
              <div class="a-tokens">${chips(s.q)}</div>
              <p>${fresh ? `<b class="a-tag">${fresh} ${fresh === 1 ? "новое" : "новых"}</b> с вашего прошлого визита · всего в продаже ${found.length}` : found.length ? `Новых пока нет · сейчас в продаже ${found.length}` : "Пока ничего нет — сообщим о первом же объявлении"}</p>
            </a>
            <a class="a-watch-thumbs" href="${link}" aria-label="Открыть результаты">${found.slice(0, 4).map((p, k) => `<span class="${k < fresh ? "new" : ""}">${U().photo(p)}</span>`).join("")}</a>
            <div class="a-watch-side">
              <a class="${fresh ? "a-cta" : "a-cta2"} a-cta-auto" href="${link}">${fresh ? `Смотреть ${fresh} ${fresh === 1 ? "новое" : "новых"}` : "Открыть поиск"}</a>
              <label class="a-switch"><input type="checkbox" ${s.notify ? "checked" : ""} data-search-notify="${i}" /><i></i><span data-notify-label>${s.notify ? "Уведомления включены" : "Уведомления выключены"}</span></label>
              <button type="button" class="a-watch-del" data-search-del="${i}">Перестать следить</button>
            </div>
          </li>`; }).join("")}</ul>` : `<section class="a-empty a-empty-sm"><h1>Пока ни за чем не следим</h1>
            <ol class="a-how"><li><b>Найдите, что нужно</b>Например, «диван до 30 тысяч рядом».</li><li><b>Нажмите «Сообщать о новых»</b>Кнопка — над результатами поиска.</li><li><b>Получите уведомление</b>Как только появится подходящее объявление.</li></ol>
            <div class="a-empty-actions"><a class="a-cta" href="${U().href("search")}">Перейти к поиску</a></div></section>`)}
    </main>${A().footer()}`;
  }
  const empty = (h, p, cta, href) => `<section class="a-empty a-empty-sm"><h1>${h}</h1><p>${p}</p><div class="a-empty-actions"><a class="a-cta" href="${href}">${cta}</a></div></section>`;

  /* =========================== ЧАТЫ =========================== */
  function ensureChat(pid) {
    const list = chats(); let c = list.find((x) => x.pid === pid && !x.mine);
    if (!c) { c = { id: `c${Date.now()}`, pid, unread: 0, msgs: [] }; list.unshift(c); U().state.set("chats", list); }
    return c.id;
  }
  function chatsScreen(ctx) {
    // переход из объявления: ?to=<id объявления>&msg=<быстрый вопрос>
    const to = ctx.params.get("to"); let openId = ctx.params.get("t");
    if (to && DB.byId(to)) {
      openId = ensureChat(to); const msg = ctx.params.get("msg");
      if (msg) { const list = chats(); const c = list.find((x) => x.id === openId); c.msgs.push({ me: 1, t: msg, at: now() }); c.pending = msg; U().state.set("chats", list); }
      const q = new URLSearchParams(location.search); q.delete("to"); q.delete("msg"); q.set("t", openId); history.replaceState(null, "", `?${q}`);
    }
    const list = chats(); const explicit = !!openId; const cur = list.find((c) => c.id === openId) || list[0];
    const row = (c) => { const p = DB.byId(c.pid), who = peer(c), last = c.msgs[c.msgs.length - 1]; return `
      <a class="a-chatrow ${cur && c.id === cur.id ? "on" : ""}" href="${U().href("chats", { t: c.id })}">
        ${U().photo(p)}<span><b>${who.name}${c.mine ? " <i>покупатель</i>" : ""}</b><em>${p.title}</em><small>${last ? (last.me ? "Вы: " : "") + U().esc(last.t) : "Напишите первым"}</small></span>
        <time>${last ? last.at : ""}${c.unread ? `<sup>${c.unread}</sup>` : ""}</time></a>`; };
    return `${A().header()}
    <main class="a-main a-chatpage ${explicit ? "a-thread-open" : ""}">
      <aside class="a-chatlist"><h1>Чаты</h1>${list.length ? list.map(row).join("") : `<p class="a-muted">Пока нет переписок. Напишите продавцу из любого объявления.</p>`}</aside>
      ${cur ? thread(cur) : ""}
    </main>${A().footer()}`;
  }
  function thread(c) {
    const p = DB.byId(c.pid), who = peer(c);
    const quick = c.mine ? ["Да, ещё продаю", "Могу показать сегодня", "Торг небольшой"] : ["Можно сегодня?", "Торг уместен?", "Где встретимся?"];
    return `<section class="a-thread" data-thread="${c.id}">
      <header class="a-thread-head">
        <a class="a-back" href="${U().href("chats")}" aria-label="К списку чатов">←</a>
        <a class="a-thread-item" href="${U().href("product", { id: p.id })}">${U().photo(p)}<span><b>${p.title}</b><small>${U().fmt(p.price)} · ${c.mine ? "ваше объявление" : p.place}</small></span></a>
        ${c.mine ? `<div class="a-thread-who"><span class="a-ava">${who.ini}</span><span><b>${who.name}</b><small>покупатель · 6 сделок</small></span></div>` : `<a class="a-thread-who" href="${U().href("seller", { id: who.id })}"><span class="a-ava">${who.ini}</span><span><b>${who.name}</b><small>отвечает ${who.reply}</small></span></a>`}
      </header>
      <p class="a-thread-safe">Не переводите предоплату в обход RUBERI: деньги защищены, только когда оплата проходит здесь.${!c.mine && p.delivery ? ` <a href="${U().href("checkout", { id: p.id })}">Купить с доставкой →</a>` : ""}</p>
      <div class="a-msgs" data-msgs>${c.msgs.map(bubble).join("") || `<p class="a-muted a-msgs-empty">Начните с короткого вопроса — кнопки ниже отправляют его в один тап.</p>`}</div>
      <div class="a-thread-quick">${quick.map((t) => `<button type="button" data-say="${U().esc(t)}">${t}</button>`).join("")}</div>
      <form class="a-say" data-say-form><input placeholder="Сообщение" autocomplete="off" aria-label="Сообщение" /><button type="submit" aria-label="Отправить">→</button></form>
    </section>`;
  }
  const bubble = (m) => `<div class="a-msg ${m.me ? "me" : ""}"><p>${U().esc(m.t)}</p><time>${m.at}</time></div>`;

  function initChats() {
    const box = document.querySelector("[data-thread]"); if (!box) return;
    const id = box.dataset.thread; const msgs = box.querySelector("[data-msgs]");
    const save = (fn) => { const list = chats(); const c = list.find((x) => x.id === id); fn(c); U().state.set("chats", list); };
    const scroll = () => { msgs.scrollTop = msgs.scrollHeight; };
    const answer = (text) => {
      const typing = document.createElement("div"); typing.className = "a-msg a-typing"; typing.innerHTML = "<p><i></i><i></i><i></i></p>";
      setTimeout(() => { msgs.append(typing); scroll(); }, 500);

        <section class="m-insight">
          <div class="m-insight-num"><small>${U().esc(what || "По запросу")} · в среднем</small><strong>${U().fmtShort(avg)}</strong><span>${n} ${plural(n)} · каждое — точка на шкале</span></div>
          <div class="m-range"><div class="m-range-track">${list.map((p) => `<a href="${U().href("product", { id: p.id })}" style="left:${pos(p.price)}%" class="${p === best ? "best" : ""}" title="${U().esc(p.title)} · ${U().fmtShort(p.price)}"></a>`).join("")}</div>
            <div class="m-range-legend"><span>${U().fmtShort(min)}</span><span>${U().fmtShort(max)}</span></div></div>
          <a class="m-insight-best" href="${U().href("product", { id: best.id })}"><span class="m-best-ph m-s-clover">${U().photo(best)}</span><span><small>Самое выгодное</small><b>${U().fmtShort(best.price)}</b>${best.title}</span>${ic("chevron_right")}</a>
        </section>

        <div class="m-grid" data-results>${list.map((p, i) => card(p).replace('<a class="m-card"', `<a class="m-card" data-i="${i}"${i >= 8 ? " hidden" : ""}`)).join("")}</div>
        ${n > 8 ? `<button type="button" class="m-tonal m-more" data-more>Показать ещё ${n - 8}</button>` : ""}
      </main>${dock()}`;
  }

  /* ---------- объявление ---------- */
  function product(ctx) {
    const p = ctx.product, s = U().seller(p), f = U().fair(p), sp = U().specs(p);
    const shots = [p].concat(DB.products.filter((x) => x.cat === p.cat && x.id !== p.id).slice(0, 3));
    return `${top()}
      <main class="m-pane m-pdp">
        <nav class="m-crumbs"><a class="m-icbtn m-icbtn-tonal" href="${U().href("search")}" data-back aria-label="Назад">${ic("arrow_back")}</a><span>${p.place} · ${p.when}</span>
          <button type="button" class="m-icbtn m-icbtn-tonal" data-toast="Ссылка скопирована" aria-label="Поделиться">${ic("share")}</button>
          <button type="button" class="m-icbtn m-icbtn-tonal m-fav-top" data-fav="${p.id}" aria-label="В избранное">${ic("favorite")}</button></nav>

        <div class="m-pdp-grid">
          <section class="m-gallery">
            <div class="m-gal-main">${U().photo(p, "").replace('class="ph "', 'class="ph" data-main-photo')}</div>
            <div class="m-gal-thumbs">${shots.map((t, i) => `<button type="button" data-thumb class="m-thumb ${i ? "" : "on"}" aria-label="Фото ${i + 1}"><span class="m-s-cookie9">${U().photo(t)}</span></button>`).join("")}</div>
          </section>

          <aside class="m-support">
            <h1>${p.title}</h1>
            ${p.sub ? `<p class="m-sub">${p.sub}</p>` : ""}
            <div class="m-pricerow"><strong>${U().fmt(p.price)}</strong>${p.fair === "low" ? `<span class="m-badge m-badge-inline">${ic("trending_down")}Ниже рынка</span>` : ""}</div>
            <div class="m-actions">
              <a class="m-filled m-btn-l" href="${U().href("chats", { to: p.id })}">${ic("chat")}Написать ${s.dat}</a>
              <div class="m-btngroup">
                ${p.delivery ? `<a class="m-tonal" href="${U().href("checkout", { id: p.id })}">${ic("local_shipping")}С доставкой</a>` : ""}
                <button type="button" class="m-tonal m-tonal-2" data-phone>${ic("call")}Телефон</button>
              </div>
            </div>
            <a class="m-seller" href="${U().href("seller", { id: s.id })}"><span class="m-avatar m-avatar-lg m-s-cookie6">${s.ini}</span><span><b>${s.name}${p.verified ? ` ${ic("verified", "m-verified")}` : ""}</b><small>★ ${s.rate} · ${s.deals} сделок · отвечает ${s.reply}</small></span>${ic("chevron_right")}</a>
            <ul class="m-facts">
              <li><span class="m-fact-ic">${ic("location_on")}</span><span><small>Где</small>${p.place} · ${U().walk(p.km)}</span></li>
              <li><span class="m-fact-ic">${ic("inventory_2")}</span><span><small>Состояние</small>${p.cond}</span></li>
              <li><span class="m-fact-ic">${ic("verified_user")}</span><span><small>Сделка</small>${p.delivery ? "Оплата под защитой" : "Личная встреча"}</span></li>
            </ul>
          </aside>

          <article class="m-details">
            <section class="m-fairbox">
              <div class="m-fair-top"><span><small>Похожие продают за</small><b>${U().fmtShort(f.from)} – ${U().fmtShort(f.to)}</b></span><span class="m-fair-label">${f.label}</span></div>
              <div class="a-fair"><div class="a-fair-bar"><i style="left:${f.pos}%"></i></div><div class="a-fair-legend"><span>${U().fmtShort(f.from)}</span><b>${f.label}</b><span>${U().fmtShort(f.to)}</span></div></div>
            </section>
            <div class="m-assists"><span class="m-label">Спросить в один тап</span>${["Ещё продаёте?", "Можно сегодня?", "Торг уместен?"].map((t) => `<a class="m-chip m-chip-sugg" href="${U().href("chats", { to: p.id, msg: t })}">${t}</a>`).join("")}</div>
            <h2 class="m-h2">Описание</h2>
            <p class="m-text">${U().describe(p)}</p>
            <h2 class="m-h2">Характеристики</h2>
            <dl class="m-list">${sp.top.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join("")}${(sp.more || []).map(([k, v]) => `<div hidden data-spec-more><dt>${k}</dt><dd>${v}</dd></div>`).join("")}</dl>
            ${(sp.more || []).length ? `<button type="button" class="m-textbtn" data-specs-more data-less="Свернуть">${ic("expand_more")}Ещё ${sp.more.length} характеристик</button>` : ""}
          </article>
        </div>

        <section class="m-sec"><div class="m-sec-head"><h2>Похожие</h2></div><div class="m-grid">${U().related(p, 8).map(card).join("")}</div></section>
      </main>${dock()}`;
  }

  window.MATERIAL = { on, top, dock, card };
  const A = window.V.a; const base = { home: A.home, search: A.search, product: A.product };
  A.home = (ctx) => (on() ? home(ctx) : base.home(ctx));
  A.search = (ctx) => (on() ? search(ctx, base.search) : base.search(ctx));
  A.product = (ctx) => (on() ? product(ctx) : base.product(ctx));
})();

  </script>
</body>
</html>
